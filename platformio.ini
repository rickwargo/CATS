; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:proto]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
framework = arduino
extra_scripts =
	pre:enable_rtti.py
	pre:define_lib_deps.py
build_type = release
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
lib_deps =
	; All dependencies are loaded dynamically by define_lib_deps.py based on build_flags.
lib_ignore =
	; RPAsyncTCP and ESPAsyncTCP are transitive deps incompatible with
	; ESP32 Arduino framework 3.x. Not needed when ELEGANTOTA_USE_ASYNC_WEBSERVER=1.
	RPAsyncTCP
	ESPAsyncTCP
build_src_filter = +<*> +<../lib/>
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-fno-rtti
build_flags =
	-fno-rtti
	-std=gnu++20
	-Iinclude -Ilib
	-DCORE_DEBUG_LEVEL=0
	-DNETWORKING
	-DNETWORK_TIME
	-DOTA_UPDATE
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
