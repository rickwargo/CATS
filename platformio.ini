; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:proto]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = override_rtti.py
build_type = debug
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
	colorize
lib_deps =
	WiFi
	WiFiMulti
	igorantolic/Ai Esp32 Rotary Encoder
	end2endzone/NonBlockingRTTTL
	Bodmer/TFT_eSPI
	https://github.com/rickwargo/TFT_eSPI_Scroll.git
	jchristensen/Timezone
	paulstoffregen/Time
	boschsensortec/BME68x Sensor library
	boschsensortec/bsec2
	electroniccats/MPU6050
	sparkfun/SparkFun Toolkit
	sparkfun/SparkFun VEML7700 Arduino Library
	lennarthennigs/Button2
;	fastled/FastLED
;	greiman/SdFat
build_src_filter = +<*> +<../lib/>
build_unflags =
	-std=gnu++11
	-fno-rtti
build_flags =
	-std=c++2a
	-Iinclude -Ilib
	-DCORE_DEBUG_LEVEL=4
	-Dtypeof=__typeof__
	-include include/TFT_eSPI_configuration.h
