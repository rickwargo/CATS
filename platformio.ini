; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1

board_build.filesystem = littlefs
framework = arduino
extra_scripts =
	pre:enable_rtti.py
build_type = debug
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
lib_deps =
	WiFi
	igorantolic/Ai Esp32 Rotary Encoder			; -5080 bytes
	end2endzone/NonBlockingRTTTL				; -12391 bytes
	Bodmer/TFT_eSPI
	jchristensen/Timezone
	paulstoffregen/Time
	boschsensortec/BME68x Sensor library
	boschsensortec/bsec2						; -10828 bytes
	electroniccats/MPU6050						; -7304 bytes
	sparkfun/SparkFun Toolkit
	sparkfun/SparkFun VEML7700 Arduino Library 	; -9480 bytes
	lennarthennigs/Button2						; -4324 bytes
	fastled/FastLED								; -44304 bytes
	esp32async/AsyncTCP
	esp32async/ESPAsyncWebServer @ 3.11.1
	ayushsharma82/ElegantOTA
build_src_filter = +<*> +<../lib/>
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-fno-rtti
build_flags =
	-fno-rtti
	-std=gnu++20
	-Iinclude -Ilib
	-ITFT_eSPI_configuration.h
	-DCORE_DEBUG_LEVEL=5
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DNETWORKING
	-DNETWORK_TIME
	-DOTA_UPDATE
	-DUI_DISPLAY
	-DENVIRONMENT_SENSOR
	-DIMU_SENSOR
	-DLIGHT_LEVEL_SENSOR
	-DBUZZER_SOUND
	-DENCODER
	-DBUTTON
	-DFAST_LED
	-DSTORAGE

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
board_build.filesystem = littlefs
framework = arduino
extra_scripts =
	pre:enable_rtti.py
	pre:define_lib_deps.py
build_type = release
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
lib_deps =
	; All dependencies are loaded dynamically by define_lib_deps.py based on build_flags.
lib_ignore =
	; RPAsyncTCP and ESPAsyncTCP are transitive deps incompatible with
	; ESP32 Arduino framework 3.x. Not needed when ELEGANTOTA_USE_ASYNC_WEBSERVER=1.
	RPAsyncTCP
	ESPAsyncTCP
build_src_filter = +<*> +<../lib/>
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-fno-rtti
build_flags =
	-fno-rtti
	-std=gnu++20
	-Iinclude -Ilib
	-DCORE_DEBUG_LEVEL=0
	-DNETWORKING
	-DNETWORK_TIME
	-DOTA_UPDATE
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
